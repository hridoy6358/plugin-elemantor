<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>WPForms Plugin</title>
  <link rel="stylesheet" href="wpforms.css">
</head>
<body>
  <header class="form-header">
    <h1>WPForms</h1>
    <p>The easiest drag-and-drop WordPress form builder.</p>
  </header>

  <section class="form-content">
    <div class="form-img">
      <img src="https://cdn-icons-png.flaticon.com/128/942/942751.png" alt="WPForms">

    <div class="form-details">
      <h2>Key Features</h2>
      <ul>
        <li>Drag & Drop Builder</li>

      </ul>
    </div>
  </section>

</html>

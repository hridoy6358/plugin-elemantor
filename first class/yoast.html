<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yoast SEO Plugin</title>
  <link rel="stylesheet" href="yoast.css">
</head>
<body>
  <header class="yoast-header">
    <h1>Yoast SEO</h1>
    <p>Optimize your site for search engines and rank higher.</p>
  </header>

  <section class="yoast-features">
    <div class="yoast-image">
      <img src="https://cdn-icons-png.flaticon.com/128/5968/5968672.png" alt="Yoast Logo">
    </div>
    <div class="yoast-description">
      <h2>Why Choose Yoast?</h2>
      <ul>
        <li>Real-time SEO analysis</li>
        <li>Meta tags and snippet previews</li>
        <li>Readability score checker</li>
        <li>XML sitemap management</li>
        <li>Google & social integration</li>
      </ul>
    </div>
  </section>
</body>
</html>

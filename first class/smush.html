<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Smush Plugin</title>
  <link rel="stylesheet" href="smush.css">
</head>
<body>
  <header class="smush-header">
    <h1>Smush</h1>
    <p>Optimize images without losing quality and improve your site speed.</p>
  </header>

  <section class="smush-main">
    <div class="smush-img">
      <img src="https://cdn-icons-png.flaticon.com/128/892/892692.png" alt="Smush Plugin">
    </div>
    <div class="smush-info">
      <h2>Why Smush?</h2>
      <ul>
        <li>Lossless Compression</li>
        <li>Lazy Load Images</li>
        <li>Bulk Image Optimization</li>
        <li>Resize & Scale on Upload</li>
        <li>WebP Support</li>
      </ul>
    </div>
  </section>
</body>
</html>
